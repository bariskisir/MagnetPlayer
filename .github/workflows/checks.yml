# Validate all workspaces and the helper distribution on supported operating systems.
name: Checks

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --global npm@12.1.0
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run format:check
      - run: npm run helper:check
